<!-- blue-sunglasses.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%" role="img" aria-label="Bhaskar Maity - Cyber Security Engineer & Bug Bounty Hunter Profile Hero">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Inter:wght@400;600;800&amp;display=swap');

      .bg { fill: #030712; }
      .window-header { fill: #0B1220; }
      .window-border { stroke: #1E293B; stroke-width: 1.5; }
      .glass-panel { fill: #0F172A; fill-opacity: 0.65; stroke: #1E3A8A; stroke-width: 1; rx: 12px; }
      
      .text-main { font-family: 'Inter', sans-serif; fill: #F8FAFC; }
      .text-title { font-family: 'Inter', sans-serif; font-weight: 800; fill: #FFFFFF; }
      .text-mono { font-family: 'Fira Code', monospace; fill: #38BDF8; }
      .text-muted { font-family: 'Fira Code', monospace; fill: #94A3B8; font-size: 13px; }
      .text-keyword { font-family: 'Fira Code', monospace; fill: #60A5FA; }
      .text-string { font-family: 'Fira Code', monospace; fill: #93C5FD; }
      .text-accent { font-family: 'Fira Code', monospace; fill: #38BDF8; }

      .ascii-art {
        font-family: 'Fira Code', monospace;
        font-size: 10px;
        fill: #38BDF8;
        white-space: pre;
        letter-spacing: 1px;
        line-height: 1.1;
      }

      .badge-bg { fill: #172554; stroke: #38BDF8; stroke-width: 1; rx: 14px; }
      .pill-bg { fill: #1E293B; fill-opacity: 0.8; stroke: #1E3A8A; stroke-width: 1; rx: 6px; }

      .cursor {
        animation: blink 0.8s step-end infinite;
        fill: #38BDF8;
      }
      .pulse-dot {
        animation: pulse 2s infinite;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulse {
        0% { opacity: 0.4; }
        50% { opacity: 1; }
        100% { opacity: 0.4; }
      }
    </style>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1180" height="610" rx="16" class="bg window-border" />
  <rect width="1180" height="610" rx="16" fill="url(#grid)" />

  <!-- Top Window Header -->
  <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 1164 0 C 1172.84 0 1180 7.16 1180 16 L 1180 44 L 0 44 Z" class="window-header" />
  <line x1="0" y1="44" x2="1180" y2="44" stroke="#1E293B" stroke-width="1.5" />

  <!-- Terminal Controls -->
  <circle cx="28" cy="22" r="6" fill="#FF5F56" />
  <circle cx="48" cy="22" r="6" fill="#FFBD2E" />
  <circle cx="68" cy="22" r="6" fill="#27C93F" />
  
  <text x="590" y="27" text-anchor="middle" class="text-muted">VirUsFly@sec-ops:~ (zsh)</text>

  <!-- ================= LEFT COLUMN: VISUAL.MAP ================= -->
  <g transform="translate(32, 68)">
    <rect width="420" height="510" class="glass-panel" />
    
    <!-- Status Indicator -->
    <rect x="24" y="20" width="180" height="28" class="badge-bg" />
    <circle cx="40" cy="34" r="4" fill="#60A5FA" class="pulse-dot" />
    <text x="54" y="38" class="text-mono" font-size="11" font-weight="600" fill="#93C5FD">SEC_CLEARANCE: ROOT</text>

    <!-- ASCII Matrix Avatar Area (Man wearing sunglasses) -->
    <g transform="translate(24, 65)">
      <rect width="372" height="320" fill="#070D19" rx="8" stroke="#1E3A8A" stroke-width="1" />
      <text x="186" y="25" text-anchor="middle" class="text-muted" font-size="11">THREAT.INTEL // BUG_BOUNTY</text>
      
      <text x="35" y="55" class="ascii-art">
        <tspan x="35" dy="0">      .:::::.      </tspan>
        <tspan x="35" dy="11">    .=========.    </tspan>
        <tspan x="35" dy="11">   /  #######  \   </tspan>
        <tspan x="35" dy="11">  | [#######]   |  </tspan>
        <tspan x="35" dy="11">  |   \ __ /    |  </tspan>
        <tspan x="35" dy="11">   \   \__/    /   </tspan>
        <tspan x="35" dy="11">    \________/     </tspan>
        <tspan x="35" dy="11">  .-[x]SEC[x]-. </tspan>
        <tspan x="35" dy="11"> /    |Bug  |    \</tspan>
        <tspan x="35" dy="11">|     |Hunt |     |</tspan>
        <tspan x="35" dy="11">|____/_______\____|</tspan>
      </text>
      
      <text x="186" y="295" text-anchor="middle" class="text-mono" font-size="12">[BHASKAR MAITY]</text>
    </g>

    <!-- Terminal Prompt Line -->
    <g transform="translate(24, 410)">
      <text x="0" y="20" class="text-mono" font-size="13" fill="#60A5FA">root@virusfly:~# <tspan fill="#F8FAFC">./pentest_target.sh</tspan></text>
      <text x="0" y="45" class="text-muted" font-size="12">> Scanning vulnerabilities &amp; exploit vectors...</text>
      <rect x="315" y="10" width="8" height="15" class="cursor" />
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: SYSTEM.INFO ================= -->
  <g transform="translate(480, 68)">
    <rect width="668" height="510" class="glass-panel" />

    <g transform="translate(36, 36)">
      <!-- Name & Title Header -->
      <text x="0" y="32" class="text-title" font-size="38" fill="url(#title-grad)">Bhaskar Maity</text>
      <text x="0" y="60" class="text-mono" font-size="16" fill="#60A5FA">Cyber Security Engineer &amp; Bug Bounty Hunter</text>
      
      <line x1="0" y1="80" x2="596" y2="80" stroke="#1E293B" stroke-width="1" />

      <!-- Profile Details Grid -->
      <g transform="translate(0, 105)" font-size="14">
        <!-- Label/Value Pairs -->
        <text x="0" y="0" class="text-muted">HANDLE</text>
        <text x="130" y="0" class="text-mono">VirUsFly</text>

        <text x="0" y="30" class="text-muted">FOCUS</text>
        <text x="130" y="30" class="text-main" font-weight="600">Vulnerability Assessment, Penetration Testing &amp; Red Teaming</text>

        <text x="0" y="60" class="text-muted">DOMAINS</text>
        <text x="130" y="60" class="text-string">Web App Security · Network Defense · Automated Scripting</text>

        <text x="0" y="90" class="text-muted">STATUS</text>
        <text x="130" y="90" class="text-accent">Hunting Zero-Days &amp; Securing Enterprise Infrastructure</text>
      </g>

      <line x1="0" y1="225" x2="596" y2="225" stroke="#1E293B" stroke-width="1" />

      <!-- Tech Stack Pills Section -->
      <text x="0" y="255" class="text-muted" font-size="12">SECURITY.TOOLING_STACK</text>
      
      <g transform="translate(0, 275)">
        <!-- Row 1 -->
        <rect x="0" y="0" width="90" height="30" class="pill-bg" />
        <text x="45" y="20" text-anchor="middle" class="text-mono" font-size="12">Python</text>

        <rect x="100" y="0" width="80" height="30" class="pill-bg" />
        <text x="140" y="20" text-anchor="middle" class="text-mono" font-size="12">Bash</text>

        <rect x="190" y="0" width="110" height="30" class="pill-bg" />
        <text x="245" y="20" text-anchor="middle" class="text-mono" font-size="12">PowerShell</text>

        <rect x="310" y="0" width="80" height="30" class="pill-bg" />
        <text x="350" y="20" text-anchor="middle" class="text-mono" font-size="12">C / C++</text>

        <rect x="400" y="0" width="80" height="30" class="pill-bg" />
        <text x="440" y="20" text-anchor="middle" class="text-mono" font-size="12">Linux</text>

        <!-- Row 2 -->
        <rect x="0" y="40" width="90" height="30" class="pill-bg" />
        <text x="45" y="60" text-anchor="middle" class="text-mono" font-size="12">BurpSuite</text>

        <rect x="100" y="40" width="80" height="30" class="pill-bg" />
        <text x="140" y="60" text-anchor="middle" class="text-mono" font-size="12">Nmap</text>

        <rect x="190" y="40" width="80" height="30" class="pill-bg" />
        <text x="230" y="60" text-anchor="middle" class="text-mono" font-size="12">Metasploit</text>

        <rect x="280" y="40" width="70" height="30" class="pill-bg" />
        <text x="315" y="60" text-anchor="middle" class="text-mono" font-size="12">AWS</text>

        <rect x="360" y="40" width="75" height="30" class="pill-bg" />
        <text x="397" y="60" text-anchor="middle" class="text-mono" font-size="12">Git</text>
      </g>

      <!-- Bottom Command Line -->
      <g transform="translate(0, 395)">
        <rect width="596" height="40" fill="#070D19" rx="6" stroke="#1E293B" stroke-width="1" />
        <text x="16" y="25" class="text-mono" font-size="12" fill="#94A3B8">> payload.deploy(<tspan fill="#60A5FA">"bhaskarmaity250@gmail.com"</tspan>)</text>
      </g>
    </g>
  </g>
</svg>
